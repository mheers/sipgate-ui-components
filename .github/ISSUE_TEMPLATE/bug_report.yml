name: Bug report
description: Something renders wrong, crashes, or behaves unexpectedly.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. A small reproduction is worth more than a
        long description.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, a minimal repository, or a Storybook story that shows the issue.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, Vue, pnpm/npm. Include the theme if relevant.
      placeholder: Chrome 142, macOS 15, Vue 3.5.45
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Light
        - Dark
        - Both
        - Not theme related
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console output, accessibility findings.
